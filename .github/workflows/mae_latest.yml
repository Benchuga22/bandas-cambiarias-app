name: fetch-mae-latest

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mae-latest
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Fetch MAE and write latest.json (robusto)
        env:
          MAE_API_KEY: ${{ secrets.MAE_API_KEY }}
        run: |
          python - << 'PY'
          import os, json, time, requests, sys, pathlib
          API_URL = "https://api.mae.com.ar/MarketData/v1/mercado/cotizaciones/forex"
          KEY = os.environ.get("MAE_API_KEY")
          out_dir = pathlib.Path("public"); out_dir.mkdir(parents=True, exist_ok=True)
          out_path = out_dir / "latest.json"

          def write_placeholder():
              if not out_path.exists():
                  with open(out_path, "w") as f:
                      json.dump({"precio": None, "t": int(time.time())}, f, separators=(",",":"))
                  print("created placeholder latest.json (precio=null)")
              else:
                  print("kept existing latest.json")

          precio = None
          if KEY:
              headers = {
                  "x-api-key": KEY,
                  "Accept": "application/json, text/plain, */*",
                  "User-Agent": "Mozilla/5.0",
                  "Origin": "https://www.mae.com.ar",
                  "Referer": "https://www.mae.com.ar/",
              }
              try:
                  r = requests.get(API_URL, headers=headers, timeout=20)
                  if r.status_code == 200 and "<html" not in r.text.lower():
                      data = r.json()
                      cot = data["data"] if isinstance(data, dict) and "data" in data else data
                      precio = next((i.get("precioUltimo") for i in cot
                                     if isinstance(i, dict) and i.get("ticker")=="UST$T" and i.get("plazo")=="000"), None)
                  else:
                      print(f"Upstream not OK: {r.status_code}", file=sys.stderr)
              except Exception as e:
                  print(f"Fetch error: {e}", file=sys.stderr)
          else:
              print("MAE_API_KEY missing", file=sys.stderr)

          if precio is not None:
              with open(out_path, "w") as f:
                  json.dump({"precio": float(precio), "t": int(time.time())}, f, separators=(",",":"))
              print("latest.json updated")
          else:
              write_placeholder()
          PY

      - name: Commit latest.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(ci): update latest.json"
            git push
          fi
