name: actualizar-datos

# Trae el histórico del dólar mayorista (UST$T) de MAE -> data/mayorista.csv
# y las bandas cambiarias oficiales del BCRA -> data/bandas.csv.
# Corre de lunes a viernes después del cierre del mercado; también se puede
# lanzar a mano desde la pestaña Actions ("Run workflow").
on:
  schedule:
    - cron: "47 19 * * 1-5"   # 16:47 hora Argentina
    - cron: "47 23 * * 1-5"   # 20:47 hora Argentina (reintento por si el primero falló)
  workflow_dispatch:
    inputs:
      desde:
        description: "Mayorista: rehacer desde esta fecha (YYYY-MM-DD). Vacío = sólo los últimos días."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install pandas requests tzdata

      - name: Traer dólar mayorista (MAE)
        id: mae
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.desde }}" ]; then
            python scripts/actualizar_mayorista.py --desde "${{ inputs.desde }}"
          else
            python scripts/actualizar_mayorista.py
          fi

      - name: Traer bandas (BCRA)
        id: bcra
        continue-on-error: true
        run: python scripts/actualizar_bandas.py

      - name: Commitear si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "data: actualizar mayorista y bandas $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Marcar error si alguna fuente falló
        if: steps.mae.outcome == 'failure' || steps.bcra.outcome == 'failure'
        run: |
          echo "MAE: ${{ steps.mae.outcome }} / BCRA: ${{ steps.bcra.outcome }}"
          exit 1
